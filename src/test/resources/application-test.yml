spring:
  ai:
    openai:
      # 测试用假 key：OpenAI 自动配置被下方 model.chat/embedding 关闭，真实调用由 fake bean 取代
      api-key: test-key
      base-url: http://localhost:9999
    model:
      # 非 openai 值，关闭 OpenAi Chat/Embedding 自动配置（与 @ConditionalOnMissingBean 的 fake bean 双保险）
      chat: mock
      embedding: mock
    vectorstore:
      qdrant:
        host: localhost
        port: 6334
        collection-name: rag_kb_chunks_test
        use-tls: false
        initialize-schema: true

  data:
    elasticsearch:
      uris: http://localhost:9200

rag:
  rerank:
    base-url: http://localhost:8081
