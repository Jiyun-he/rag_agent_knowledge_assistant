      <text x="34" y="87" text-anchor="middle" fill="#c8d3e9" font-size="13">Retrieve</text>
    </g>

    <g transform="translate(423)">
      <rect width="92" height="66" rx="15" fill="#172747" stroke="#52698f"/>
      <path d="M27 23h38M32 33h28M38 43h16" stroke="#8d9cff" stroke-width="3" stroke-linecap="round"/>
