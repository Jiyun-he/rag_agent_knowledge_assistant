      <circle cx="133" cy="22.5" r="5" fill="#6ee3c4"/>
      <text x="149" y="28" fill="#b8c6df" font-size="13">Elasticsearch</text>
      <circle cx="280" cy="22.5" r="5" fill="#8796ff"/>
      <text x="296" y="28" fill="#b8c6df" font-size="13">RRF</text>
      <circle cx="359" cy="22.5" r="5" fill="#8796ff"/>
      <text x="375" y="28" fill="#b8c6df" font-size="13">Rerank</text>
    </g>
