    <text x="0" y="58" fill="#f6f8ff" font-family="Segoe UI, Arial, sans-serif" font-size="42" font-weight="700" letter-spacing=".4">RAG Agent</text>
    <text x="0" y="103" fill="#f6f8ff" font-family="Segoe UI, Arial, sans-serif" font-size="42" font-weight="700" letter-spacing=".4">Knowledge Assistant</text>
    <text x="1" y="143" fill="#b6c3df" font-family="Segoe UI, Arial, sans-serif" font-size="17" letter-spacing="1.7">HYBRID RETRIEVAL · RERANK · CITATIONS · EVALUATION</text>
  </g>

  <g transform="translate(650 78)" filter="url(#shadow)" font-family="Segoe UI, Arial, sans-serif">
    <path d="M92 33H151M225 33H284M358 33H417" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>
    <path d="M118 27L128 33L118 39M251 27L261 33L251 39M384 27L394 33L384 39" fill="none" stroke="#78dbc8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <g>
      <rect width="92" height="66" rx="15" fill="#172747" stroke="#52698f"/>
      <path d="M27 20h30l8 8v21H27zM57 20v9h8" fill="none" stroke="#75e1c5" stroke-width="2"/>
      <text x="46" y="87" text-anchor="middle" fill="#c8d3e9" font-size="13">Documents</text>
    </g>

    <g transform="translate(157)">
      <rect width="68" height="66" rx="15" fill="#172747" stroke="#52698f"/>
      <circle cx="34" cy="27" r="13" fill="none" stroke="#75e1c5" stroke-width="2"/>
      <path d="M25 27h18M34 18v18" stroke="#75e1c5" stroke-width="2" stroke-linecap="round"/>
      <text x="34" y="87" text-anchor="middle" fill="#c8d3e9" font-size="13">Index</text>
    </g>

    <g transform="translate(290)">
      <rect width="68" height="66" rx="15" fill="#172747" stroke="#52698f"/>
      <circle cx="30" cy="28" r="13" fill="none" stroke="#8d9cff" stroke-width="2"/>
