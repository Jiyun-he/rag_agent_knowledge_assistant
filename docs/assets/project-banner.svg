<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">RAG Agent Knowledge Assistant</title>
  <desc id="desc">A dark gradient banner showing a retrieval augmented generation pipeline.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111f"/>
      <stop offset="0.52" stop-color="#111d3a"/>
      <stop offset="1" stop-color="#162957"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#69e6c6"/>
      <stop offset="1" stop-color="#7d8cff"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#638bff" stop-opacity=".28"/>
      <stop offset="1" stop-color="#638bff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".28"/>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="24" fill="url(#background)"/>
  <circle cx="980" cy="150" r="250" fill="url(#glow)"/>
  <path d="M0 257 C180 203 320 312 498 249 S835 203 1200 248 V320 H0Z" fill="#68dfc0" opacity=".045"/>

  <g opacity=".16" stroke="#a8b8dc" stroke-width="1">
    <path d="M58 54H1142M58 106H1142M58 158H1142M58 210H1142M58 262H1142"/>
    <path d="M92 32V288M212 32V288M332 32V288M452 32V288M572 32V288M692 32V288M812 32V288M932 32V288M1052 32V288"/>
  </g>

  <g transform="translate(66 62)">
