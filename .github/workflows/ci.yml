name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests · Java 17
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check new commit messages
        run: python3 scripts/quality/check_commit_messages.py

      - name: Check repository style
        run: python3 scripts/quality/check_style.py

      - name: Test quality scripts
        run: python3 -m unittest discover --start-directory scripts/quality/tests

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run unit tests
        run: ./mvnw --batch-mode --no-transfer-progress test
